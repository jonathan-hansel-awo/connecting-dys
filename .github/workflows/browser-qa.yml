name: Website regression checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: website-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: QA / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-narrow, mobile-wide, tablet, desktop, phone-landscape, reflow-320]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Check production pages and interactions
        run: npm run test:browser -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-qa-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
